[project]
name = "agent-sample-backend"
version = "0.1.0"
description = "FastAPI + LangGraph backend for the agent-sample chat UI."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "langgraph==1.1.10",
    "langchain-core==1.3.3",
    "langchain-ollama==1.1.0",
    "pydantic>=2,<3",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
